<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat - MindWell AI</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chatbot.css">
</head>
<body data-page="chat">
<main>
  <h1 data-i18n="chat.title"></h1>
  <section class="panel" style="margin-bottom:1rem">
    <h2 data-i18n="interests.title"></h2>
    <p class="muted" data-i18n="interests.hint"></p>
    <div id="interest-picker" class="chips"></div>
  </section>
  <div class="chat-wrap">
    <div id="chat-log" class="chat-log" aria-live="polite"></div>
    <form id="chat-form" class="chat-form" autocomplete="off">
      <input id="chat-input" type="text" maxlength="500" data-i18n-ph="chat.placeholder" data-i18n-aria="chat.placeholder">
      <button class="btn mint" type="submit" data-i18n="common.send"></button>
      <button class="btn soft" type="button" id="chat-reset" data-i18n="common.reset"></button>
    </form>
    <p class="muted" data-i18n="chat.privacy"></p>
  </div>
</main>
<script src="js/storage.js"></script>
<script src="js/language.js"></script>
<script src="js/preferences.js"></script>
<script src="js/app.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
