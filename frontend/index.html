<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindWell AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
<main>
  <section class="hero">
    <div>
      <h1 data-i18n="home.title"></h1>
      <p data-i18n="home.sub"></p>
      <div class="row">
        <a class="btn mint" href="chatbot.html" data-i18n="home.chat"></a>
        <a class="btn apricot" href="games.html" data-i18n="home.games"></a>
        <a class="btn soft" href="breathing.html" data-i18n="home.breath"></a>
      </div>
    </div>
    <div class="hero-scene" aria-hidden="true">
      <span class="falling" style="left:12%;animation-delay:0s">🌸</span>
      <span class="falling" style="left:34%;animation-delay:2s">🎵</span>
      <span class="falling" style="left:58%;animation-delay:4s">🦋</span>
      <span class="falling" style="left:78%;animation-delay:1s">⭐</span>
      <span class="monster">👾</span><span class="princess">👸</span>
    </div>
  </section>

  <section class="panel" style="margin-bottom:1.25rem">
    <h2 data-i18n="interests.title"></h2>
    <p class="muted" data-i18n="interests.hint"></p>
    <div id="interest-picker" class="chips"></div>
    <p style="margin-top:1rem"><button id="clear-data" class="btn soft" type="button" data-i18n="common.clearData"></button></p>
  </section>

  <section class="grid">
    <a class="panel" href="games.html" style="text-decoration:none"><h2 data-i18n="home.card.games"></h2><p class="muted" data-i18n="home.card.gamesText"></p></a>
    <a class="panel" href="breathing.html" style="text-decoration:none"><h2 data-i18n="home.card.breath"></h2><p class="muted" data-i18n="home.card.breathText"></p></a>
    <a class="panel" href="mood.html" style="text-decoration:none"><h2 data-i18n="home.card.mood"></h2><p class="muted" data-i18n="home.card.moodText"></p></a>
  </section>
</main>
<script src="js/storage.js"></script>
<script src="js/language.js"></script>
<script src="js/preferences.js"></script>
<script src="js/app.js"></script>
<script>
  Prefs.renderPicker(document.getElementById('interest-picker'));
  document.getElementById('clear-data').addEventListener('click', function () {
    var lang = Lang.current; Store.clearAll(); Store.set('lang', lang);
    Prefs.renderPicker(document.getElementById('interest-picker'));
    location.reload();
  });
</script>
</body>
</html>
