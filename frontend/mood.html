<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood - MindWell AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="mood">
<main>
  <h1 data-i18n="mood.title"></h1>
  <p class="muted" data-i18n="mood.hint"></p>
  <div class="mood-options" role="group">
    <button class="mood-btn" type="button" data-mood="great" aria-pressed="false"><span class="em">😄</span><span data-i18n="mood.great"></span></button>
    <button class="mood-btn" type="button" data-mood="good" aria-pressed="false"><span class="em">🙂</span><span data-i18n="mood.good"></span></button>
    <button class="mood-btn" type="button" data-mood="okay" aria-pressed="false"><span class="em">😐</span><span data-i18n="mood.okay"></span></button>
    <button class="mood-btn" type="button" data-mood="low" aria-pressed="false"><span class="em">😔</span><span data-i18n="mood.low"></span></button>
    <button class="mood-btn" type="button" data-mood="hard" aria-pressed="false"><span class="em">😢</span><span data-i18n="mood.hard"></span></button>
  </div>
  <p id="mood-reply" style="font-weight:700" aria-live="polite"></p>
  <p id="mood-help" class="muted" aria-live="polite"></p>
  <div class="row">
    <a class="btn mint" href="chatbot.html" data-i18n="nav.chat"></a>
    <a class="btn apricot" href="games.html" data-i18n="nav.games"></a>
    <a class="btn soft" href="breathing.html" data-i18n="nav.breathing"></a>
    <button id="mood-skip" class="btn soft" type="button" data-i18n="common.skip"></button>
  </div>
</main>
<script src="js/storage.js"></script>
<script src="js/language.js"></script>
<script src="js/preferences.js"></script>
<script src="js/app.js"></script>
<script src="js/mood.js"></script>
</body>
</html>
